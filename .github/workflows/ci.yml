name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, format check, and build
        run: npm run check

      - name: Run unit & integration tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        mongodb-version: ["7.0", "8.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install MongoDB ${{ matrix.mongodb-version }} & Database Tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-${{ matrix.mongodb-version }}.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-${{ matrix.mongodb-version }}.gpg
          DISTRO="noble"
          if [ "${{ matrix.mongodb-version }}" = "7.0" ]; then DISTRO="jammy"; fi
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-${{ matrix.mongodb-version }}.gpg ] https://repo.mongodb.org/apt/ubuntu ${DISTRO}/mongodb-org/${{ matrix.mongodb-version }} multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-${{ matrix.mongodb-version }}.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server mongodb-org-mongos mongodb-database-tools

      - name: Install dependencies
        run: npm ci

      - name: Run full test & coverage suite (Unit + Integration + Real MongoDB ${{ matrix.mongodb-version }} E2E)
        run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mongovault:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
