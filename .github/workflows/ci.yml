name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, format check, and build
        run: npm run check

      - name: Run unit & integration tests
        run: npm test

  e2e:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        include:
          - mongodb-version: "7.0"
            os: ubuntu-22.04
            distro: jammy
            pgp: server-7.0.asc
          - mongodb-version: "8.0"
            os: ubuntu-24.04
            distro: noble
            pgp: server-8.0.asc
          - mongodb-version: "9.0"
            os: ubuntu-24.04
            distro: noble
            pgp: server-9.asc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      - name: Install MongoDB ${{ matrix.mongodb-version }} & Database Tools
        run: |
          curl -fsSL https://pgp.mongodb.com/${{ matrix.pgp }} | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-${{ matrix.mongodb-version }}.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-${{ matrix.mongodb-version }}.gpg ] https://repo.mongodb.org/apt/ubuntu ${{ matrix.distro }}/mongodb-org/${{ matrix.mongodb-version }} multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-${{ matrix.mongodb-version }}.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server mongodb-org-mongos mongodb-database-tools

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript artifacts
        run: npm run build

      - name: Run full test & coverage suite (Unit + Integration + Real MongoDB ${{ matrix.mongodb-version }} E2E, shard ${{ matrix.shard }}/2)
        run: npm run test:coverage -- --shard=${{ matrix.shard }}/2

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mongovault:latest
