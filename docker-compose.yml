services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: production
    volumes:
      - mongo_data:/data/db

  localstack:
    image: localstack/localstack:3.4
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - localstack_data:/var/lib/localstack

  s3-init:
    image: amazon/aws-cli:2.15.40
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: >
      /bin/sh -c " until aws --endpoint-url=http://localstack:4566 s3 mb s3://backups; do
        sleep 1;
      done; exit 0; "

  backup-service:
    build: .
    restart: unless-stopped
    depends_on:
      - mongodb
      - localstack
      - s3-init
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: "mongodb://mongodb:27017/production"
      MONGODB_DATABASE: "production"
      S3_ENDPOINT: "http://localstack:4566"
      S3_REGION: "ap-south-1"
      S3_BUCKET: "backups"
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: "test"
      S3_SECRET_ACCESS_KEY: "test"
      S3_PREFIX: "mongodb"
      BACKUP_CRON: "0 2 * * *"
      BACKUP_TIMEZONE: "UTC"
      BACKUP_ON_START: "true"
      HTTP_PORT: 8080
      LOG_LEVEL: "info"
      RETENTION_KEEP_LAST: 3
      RETENTION_KEEP_DAILY: 7

volumes:
  mongo_data:
  localstack_data:
