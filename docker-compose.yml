services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: production
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword; do
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/backups;
      exit 0;
      "

  backup-service:
    build: .
    restart: unless-stopped
    depends_on:
      - mongodb
      - minio
      - minio-init
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: "mongodb://mongodb:27017/production"
      MONGODB_DATABASE: "production"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "backups"
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadminpassword"
      S3_PREFIX: "mongodb"
      BACKUP_CRON: "0 2 * * *"
      BACKUP_TIMEZONE: "UTC"
      BACKUP_ON_START: "true"
      HTTP_PORT: 8080
      LOG_LEVEL: "info"
      RETENTION_KEEP_LAST: 3
      RETENTION_KEEP_DAILY: 7

volumes:
  mongo_data:
  minio_data:
