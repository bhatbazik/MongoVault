services:
  mongodb:
    image: mongo:9.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: production
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:2026.04.3
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - localstack_data:/var/lib/localstack

  s3-init:
    image: amazon/aws-cli:2.42.2
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: >
      /bin/sh -c " until aws --endpoint-url=http://localstack:4566 s3 mb s3://backups; do
        sleep 1;
      done; exit 0; "

  backup-service:
    build: .
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: "mongodb://mongodb:27017/production?replicaSet=rs0"
      MONGODB_DATABASE: "*"
      MONGODB_OPLOG: "true"
      PITR_ENABLED: "true"
      S3_ENDPOINT: "http://localstack:4566"
      S3_REGION: "ap-south-1"
      S3_BUCKET: "backups"
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: "test"
      S3_SECRET_ACCESS_KEY: "test"
      S3_PREFIX: "mongodb"
      BACKUP_CRON: "0 2 * * *"
      BACKUP_TIMEZONE: "UTC"
      BACKUP_ON_START: "true"
      HTTP_PORT: 8080
      LOG_LEVEL: "info"
      RETENTION_KEEP_LAST: 3
      RETENTION_KEEP_DAILY: 7
      NOTIFY_ON_SUCCESS: "true"

volumes:
  mongo_data:
  localstack_data:
